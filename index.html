<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beep test">
<title>Beep test</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/ikona-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<nav class="traka" id="traka"></nav>

<script src="js/protocol.js"></script>
<script src="js/testovi.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/run.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  /* Kad nova verzija preuzme stranicu, osvezi je jednom - inace bi trener
     gledao staru sve dok ne zatvori i ne otvori aplikaciju jos jednom.
     Usred testiranja se ne osvezava, da ne prekine merenje. */
  var osvezeno = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (osvezeno) return;
    if ((location.hash || '') === '#/tok') return;
    osvezeno = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.update();
    }).catch(function () { /* radi i bez toga */ });
  });
}
</script>
</body>
</html>
